services:
  mysql:
    image: mysql:8.4
    networks:
      - dev-bridge
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dev}
      MYSQL_USER: ${MYSQL_USER:-dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    networks:
      - dev-bridge
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  dev-bridge:
    name: ${DEV_NETWORK_NAME:-dev-bridge}
    driver: bridge
