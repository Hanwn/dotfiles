name: CI

on:
  push:
    branches: [master, devbox]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install.sh && echo "✓ install.sh syntax OK"
      - name: Validate Brewfile
        run: |
          grep -E '^brew "' Brewfile | head -3 && echo "✓ Brewfile looks valid"
      - name: Validate config files
        run: |
          find . -name "*.toml" ! -path "./.git/*" | while read f; do
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" && echo "✓ $f" || (echo "✗ $f"; exit 1)
          done

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: Run install.sh
        timeout-minutes: 30
        run: bash install.sh
      - name: Verify
        run: |
          for t in zsh git tmux nvim starship fzf rg fd bat eza zoxide stow; do
            command -v $t &>/dev/null && echo "✓ $t" || echo "✗ $t"
          done
          [ -f ~/.zshenv ] && echo "✓ ~/.zshenv" || echo "✗ ~/.zshenv missing"
          [ -d ~/.config/zsh ] && echo "✓ ~/.config/zsh" || echo "✗ ~/.config/zsh missing"
          [ -f ~/.config/git/config.local ] && echo "✓ config.local" || echo "✗ config.local missing"
          [ -f ~/.config/zsh/.local.env ] && echo "✓ .local.env" || echo "✗ .local.env missing"

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh
        timeout-minutes: 30
        run: bash install.sh
      - name: Verify
        run: |
          for t in zsh git tmux nvim starship fzf rg fd bat eza zoxide stow; do
            command -v $t &>/dev/null && echo "✓ $t" || echo "✗ $t"
          done
          [ -f ~/.zshenv ] && echo "✓ ~/.zshenv" || echo "✗ ~/.zshenv missing"
          [ -d ~/.config/zsh ] && echo "✓ ~/.config/zsh" || echo "✗ ~/.config/zsh missing"
          [ -f ~/.config/git/config.local ] && echo "✓ config.local" || echo "✗ config.local missing"
          [ -f ~/.config/zsh/.local.env ] && echo "✓ .local.env" || echo "✗ .local.env missing"
