name: CI

on:
  push:
    branches: [master, devbox]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        run: bash -n install.sh && echo "✓ install.sh syntax OK"
      - name: Validate Brewfile
        run: |
          grep -E '^(brew|tap|cask) "' Brewfile | head -5 && echo "✓ Brewfile looks valid"
      - name: Validate TOML config files
        run: |
          find . -name "*.toml" ! -path "./.git/*" | while read f; do
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" && echo "✓ $f" || (echo "✗ $f"; exit 1)
          done

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Install stow and zsh
        run: sudo apt-get update && sudo apt-get install -y stow zsh
      - name: Run install.sh
        timeout-minutes: 30
        run: bash install.sh
      - name: Verify installation
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

          echo "=== Checking binaries ==="
          for tool in zsh git tmux nvim starship fzf rg fd bat eza zoxide stow; do
            if command -v $tool &>/dev/null; then
              echo "✓ $tool"
            else
              echo "✗ $tool missing"
              exit 1
            fi
          done

          echo "=== Checking dotfiles ==="
          [ -f ~/.zshenv ] && echo "✓ ~/.zshenv" || (echo "✗ ~/.zshenv missing"; exit 1)
          [ -d ~/.config/zsh ] && echo "✓ ~/.config/zsh" || (echo "✗ ~/.config/zsh missing"; exit 1)
          [ -f ~/.config/git/config.local ] && echo "✓ config.local" || (echo "✗ config.local missing"; exit 1)
          [ -f ~/.config/zsh/.local.env ] && echo "✓ .local.env" || (echo "✗ .local.env missing"; exit 1)

          echo "=== Verifying Brewfile hash tracking ==="
          [ -f ~/.local/state/dotfiles/brewfile.sha256 ] && echo "✓ Brewfile hash recorded" || echo "⚠ Brewfile hash not found"

      - name: Test zsh configuration
        run: |
          echo "=== Testing zsh startup ==="
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          zsh -c 'echo "✓ zsh loaded successfully"' || (echo "✗ zsh failed to start"; exit 1)

          echo "=== Checking zsh syntax ==="
          for f in ~/.zshenv ~/.config/zsh/.zshrc ~/.config/zsh/.zprofile ~/.config/zsh/.aliases.zsh ~/.config/zsh/conf.d/*.zsh; do
            if zsh -n "$f"; then
              echo "✓ $(basename "$f")"
            else
              echo "✗ $(basename "$f") has syntax errors"
              exit 1
            fi
          done

      - name: Test idempotency
        run: |
          echo "=== Running install.sh second time ==="
          bash install.sh
          echo "✓ Second run completed without errors"

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Run install.sh
        timeout-minutes: 30
        run: bash install.sh
      - name: Verify installation
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"

          echo "=== Checking binaries ==="
          for tool in zsh git tmux nvim starship fzf rg fd bat eza zoxide stow; do
            if command -v $tool &>/dev/null; then
              echo "✓ $tool"
            else
              echo "✗ $tool missing"
              exit 1
            fi
          done

          echo "=== Checking dotfiles ==="
          [ -f ~/.zshenv ] && echo "✓ ~/.zshenv" || (echo "✗ ~/.zshenv missing"; exit 1)
          [ -d ~/.config/zsh ] && echo "✓ ~/.config/zsh" || (echo "✗ ~/.config/zsh missing"; exit 1)
          [ -f ~/.config/git/config.local ] && echo "✓ config.local" || (echo "✗ config.local missing"; exit 1)
          [ -f ~/.config/zsh/.local.env ] && echo "✓ .local.env" || (echo "✗ .local.env missing"; exit 1)

          echo "=== Verifying Brewfile hash tracking ==="
          [ -f ~/.local/state/dotfiles/brewfile.sha256 ] && echo "✓ Brewfile hash recorded" || echo "⚠ Brewfile hash not found"

      - name: Test zsh configuration
        run: |
          echo "=== Testing zsh startup ==="
          eval "$(/opt/homebrew/bin/brew shellenv)"
          zsh -c 'echo "✓ zsh loaded successfully"' || (echo "✗ zsh failed to start"; exit 1)

          echo "=== Checking zsh syntax ==="
          for f in ~/.zshenv ~/.config/zsh/.zshrc ~/.config/zsh/.zprofile ~/.config/zsh/.aliases.zsh ~/.config/zsh/conf.d/*.zsh; do
            if zsh -n "$f"; then
              echo "✓ $(basename "$f")"
            else
              echo "✗ $(basename "$f") has syntax errors"
              exit 1
            fi
          done

      - name: Test idempotency
        run: |
          echo "=== Running install.sh second time ==="
          bash install.sh
          echo "✓ Second run completed without errors"
