gui:
  nerdFontsVersion: "3"

git:
  pagers:
    - pager: delta --dark --paging=never

keybinding:
  universal:
    prevBlock-alt: K
    nextBlock-alt: J
    nextTab: l
    prevTab: h
    prevItem: k
    nextItem: j
    scrollUpMain-alt1: <up>
    scrollDownMain-alt1: <down>

os:
  editPreset: "nvim"
