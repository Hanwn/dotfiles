# ── Font ─────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        14.0

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0
shell_integration enabled no-cursor

# ── Scrollback ───────────────────────────────────────────────────────
scrollback_lines 100000
scrollback_pager less +G -R

# ── Mouse ────────────────────────────────────────────────────────────
copy_on_select clipboard
mouse_hide_wait 3.0
select_by_word_characters :@-./_~?&=%+#

# ── Performance ──────────────────────────────────────────────────────
repaint_delay 10
input_delay 3

# ── Bell ─────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Window ───────────────────────────────────────────────────────────
remember_window_size yes
hide_window_decorations no
confirm_os_window_close 0

# ── Tab bar ──────────────────────────────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #1a1a1a
active_tab_background   #cccccc
inactive_tab_foreground #999999
inactive_tab_background #1a1a1a

# ── Clipboard / OSC 52 ──────────────────────────────────────────────
clipboard_control write-clipboard write-primary read-clipboard

# ── macOS ────────────────────────────────────────────────────────────
macos_option_as_alt yes
macos_titlebar_color background
macos_traditional_fullscreen yes

# ── Remote control ───────────────────────────────────────────────────
allow_remote_control yes

# ── Colors (Raycast Dark) ────────────────────────────────────────────
background #1a1a1a
foreground #ffffff
selection_background #333333
selection_foreground #595959
cursor #cccccc
cursor_text_color #999999

color0  #000000
color1  #ff5360
color2  #59d499
color3  #ffc531
color4  #56c2ff
color5  #cf2f98
color6  #52eee5
color7  #ffffff
color8  #4c4c4c
color9  #ff6363
color10 #59d499
color11 #ffc531
color12 #56c2ff
color13 #cf2f98
color14 #52eee5
color15 #ffffff

# ── Keymaps ──────────────────────────────────────────────────────────
map super+c copy_to_clipboard
map super+v paste_from_clipboard

