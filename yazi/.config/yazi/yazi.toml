sort-by = "natural"
sort-dir-first = true
sort-reverse = false
show-symlink = true
linemode = "size"

[preview]
image-quality = 75
max-width = 600
max-height = 900
image_filter = "triangle"

[opener]
edit = [
    { run = '$EDITOR "$@"', block = true, for = "unix" },
]
open = [
    { run = 'open "$@"', for = "macos" },
]
reveal = [
    { run = 'open -R "$@"', for = "macos" },
]
