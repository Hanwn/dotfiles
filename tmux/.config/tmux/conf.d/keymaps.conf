setw -g mode-keys vi


bind v copy-mode

# pane 导航 — Ctrl-hjkl，与 nvim 无缝联动
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# resize 模式（同 herdr: prefix+r 进入，h/j/k/l 调整）
bind r switch-client -T resize-mode
bind -r -T resize-mode h resize-pane -L 2
bind -r -T resize-mode j resize-pane -D 1
bind -r -T resize-mode k resize-pane -U 1
bind -r -T resize-mode l resize-pane -R 2

# 关闭 pane（跳过确认）
bind x kill-pane
