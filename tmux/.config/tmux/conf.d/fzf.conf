set -g popup-border-lines none
set -g popup-style bg=default,fg=default

unbind s
unbind w

bind-key s display-popup -E -w 60% -h 60% "source ${XDG_CONFIG_HOME}/zsh/conf.d/fzf.zsh; target=\$(tmux list-sessions -F '#{session_name}' | fzf --no-height --prompt='session> '); [ -n \"\$target\" ] && tmux switch-client -t \"\$target\""
bind-key w display-popup -E -w 60% -h 60% "source ${XDG_CONFIG_HOME}/zsh/conf.d/fzf.zsh; target=\$(tmux list-windows -F ' #{window_index}: #{window_name}' | fzf --no-height --prompt='window> '); [ -n \"\$target\" ] && tmux select-window -t \"\${target%% *}\""
