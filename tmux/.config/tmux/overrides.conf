# 覆盖 tmux-yank 的 copy-mode 绑定（必须在 TPM 之后加载）

# v: 开始选择（tmux-yank 会把 v 改成 rectangle-toggle，这里覆盖回来）
unbind -T copy-mode-vi v
bind -T copy-mode-vi v send -X begin-selection

# 模拟 vim text objects: vi + w/'/"/`/(/{/[
bind -T copy-mode-vi i switch-client -T copy-mode-vi-inner
bind -T copy-mode-vi a switch-client -T copy-mode-vi-outer

# inner word
bind -T copy-mode-vi-inner w send -X select-word
# inner 引号和括号
bind -T copy-mode-vi-inner "'" send -X jump-to-forward "'" \; send -X begin-selection \; send -X jump-to-backward "'"
bind -T copy-mode-vi-inner '"' send -X jump-to-forward '"' \; send -X begin-selection \; send -X jump-to-backward '"'
bind -T copy-mode-vi-inner '`' send -X jump-to-forward '`' \; send -X begin-selection \; send -X jump-to-backward '`'
bind -T copy-mode-vi-inner '(' send -X jump-forward ')' \; send -X begin-selection \; send -X jump-backward '(' \; send -X cursor-right
bind -T copy-mode-vi-inner ')' send -X jump-forward ')' \; send -X begin-selection \; send -X jump-backward '(' \; send -X cursor-right
bind -T copy-mode-vi-inner '{' send -X jump-forward '}' \; send -X begin-selection \; send -X jump-backward '{' \; send -X cursor-right
bind -T copy-mode-vi-inner '}' send -X jump-forward '}' \; send -X begin-selection \; send -X jump-backward '{' \; send -X cursor-right
bind -T copy-mode-vi-inner '[' send -X jump-forward ']' \; send -X begin-selection \; send -X jump-backward '[' \; send -X cursor-right
bind -T copy-mode-vi-inner ']' send -X jump-forward ']' \; send -X begin-selection \; send -X jump-backward '[' \; send -X cursor-right

# y: 复制到系统剪贴板，不退出 copy-mode
unbind -T copy-mode-vi y
bind -T copy-mode-vi y send -X copy-pipe "wl-copy"
# Enter: 复制到系统剪贴板，不退出 copy-mode
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe "wl-copy"
# 鼠标拖拽结束：复制到系统剪贴板，不退出 copy-mode
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy"
