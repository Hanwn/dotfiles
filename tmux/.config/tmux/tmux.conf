# Options
set -g escape-time 0
set -g mouse on
set -g history-limit 100000
set -g display-time 3000

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -g focus-events on
set -g status-position top
set -as terminal-overrides ',xterm-256color:RGB'

# Clipboard
set -g set-clipboard on
set -g @yank_selection 'clipboard'

# Key bindings
setw -g mode-keys vi
bind v copy-mode

# New windows, splits, and sessions inherit the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind N new-session -c "#{pane_current_path}"

# Resize mode: prefix+r, then h/j/k/l.
bind r switch-client -T resize-mode
bind -r -T resize-mode h resize-pane -L 2
bind -r -T resize-mode j resize-pane -D 1
bind -r -T resize-mode k resize-pane -U 1
bind -r -T resize-mode l resize-pane -R 2
bind x kill-pane

# FZF popups
set -g popup-border-lines none
set -g popup-style bg=default,fg=default
unbind s
unbind w
bind-key s display-popup -E -w 60% -h 60% "source ${XDG_CONFIG_HOME}/zsh/conf.d/fzf.zsh; target=\$(tmux list-sessions -F '#{session_name}' | fzf --no-height --prompt='session> '); [ -n \"\$target\" ] && tmux switch-client -t \"\$target\""
bind-key w display-popup -E -w 60% -h 60% "source ${XDG_CONFIG_HOME}/zsh/conf.d/fzf.zsh; target=\$(tmux list-windows -F ' #{window_index}: #{window_name}' | fzf --no-height --prompt='window> '); [ -n \"\$target\" ] && tmux select-window -t \"\${target%% *}\""

# Theme
set -g @tmux_power_theme 'everforest'
set -g @tmux_power_right_arrow_icon ''
set -g @tmux_power_left_arrow_icon ''
set -g @tmux_power_left_a ' #h'
set -g @tmux_power_left_b ' #S'
set -g @tmux_power_right_y ' %T'
set -g @tmux_power_right_z ' %F'
set -g @tmux_power_prefix_highlight_pos 'R'

set -g pane-active-border-style fg=#a7c080
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format ''
set -g pane-border-indicators off

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${XDG_DATA_HOME}/tmux/plugins"
if-shell "[ ! -d ${XDG_DATA_HOME}/tmux/plugins/tpm ]" \
    "run-shell 'git clone https://github.com/tmux-plugins/tpm ${XDG_DATA_HOME}/tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_at_edge 'stop'

# 启动 TPM（必须在插件声明之后）
run-shell "${XDG_DATA_HOME}/tmux/plugins/tpm/tpm"

# Plugin overrides: tmux-yank changes these copy-mode bindings.
unbind -T copy-mode-vi v
bind -T copy-mode-vi v send -X begin-selection

# Vim-style text objects in copy mode.
bind -T copy-mode-vi i switch-client -T copy-mode-vi-inner
bind -T copy-mode-vi a switch-client -T copy-mode-vi-outer
bind -T copy-mode-vi-inner w send -X select-word
bind -T copy-mode-vi-inner "'" send -X jump-to-forward "'" \; send -X begin-selection \; send -X jump-to-backward "'"
bind -T copy-mode-vi-inner '"' send -X jump-to-forward '"' \; send -X begin-selection \; send -X jump-to-backward '"'
bind -T copy-mode-vi-inner '`' send -X jump-to-forward '`' \; send -X begin-selection \; send -X jump-to-backward '`'
bind -T copy-mode-vi-inner '(' send -X jump-forward ')' \; send -X begin-selection \; send -X jump-backward '(' \; send -X cursor-right
bind -T copy-mode-vi-inner ')' send -X jump-forward ')' \; send -X begin-selection \; send -X jump-backward '(' \; send -X cursor-right
bind -T copy-mode-vi-inner '{' send -X jump-forward '}' \; send -X begin-selection \; send -X jump-backward '{' \; send -X cursor-right
bind -T copy-mode-vi-inner '}' send -X jump-forward '}' \; send -X begin-selection \; send -X jump-backward '{' \; send -X cursor-right
bind -T copy-mode-vi-inner '[' send -X jump-forward ']' \; send -X begin-selection \; send -X jump-backward '[' \; send -X cursor-right
bind -T copy-mode-vi-inner ']' send -X jump-forward ']' \; send -X begin-selection \; send -X jump-backward '[' \; send -X cursor-right

# Copy to the system clipboard without leaving copy mode.
unbind -T copy-mode-vi y
bind -T copy-mode-vi y send -X copy-pipe "wl-copy"
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe "wl-copy"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy"
