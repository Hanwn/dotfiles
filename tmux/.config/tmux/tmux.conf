##### 基础 #####

set -g escape-time 0
set -g mouse on
set -g history-limit 100000
set -g display-time 3000

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'


##### UI #####

set -g pane-active-border-style fg=white
set -g pane-border-lines double
set -g pane-border-status top
set -g pane-border-indicators off


##### vim 行为 #####

setw -g mode-keys vi

# 进入 copy-mode（绕开 [）
bind v copy-mode

# pane 导航
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R




##### 剪贴板 #####

set -g set-clipboard on
set -g @yank_selection 'clipboard'


##### TPM #####

set-environment -g TMUX_PLUGIN_MANAGER_PATH "${XDG_DATA_HOME}/tmux/plugins"

if-shell "[ ! -d ${XDG_DATA_HOME}/tmux/plugins/tpm ]" \
    "run-shell 'git clone https://github.com/tmux-plugins/tpm ${XDG_DATA_HOME}/tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'


##### tmux-power #####

set -g @tmux_power_theme 'everforest'

# Section 图标（新版本使用 section 模型，旧的 *_icon 选项已废弃）
# 格式: set -g @tmux_power_<section> '图标 内容'
set -g @tmux_power_left_a ' #{USER}@#h'
set -g @tmux_power_left_b ' #S'
set -g @tmux_power_right_y ' %T'
set -g @tmux_power_right_z ' %F'

set -g @tmux_power_prefix_highlight_pos 'R'


##### fzf #####

set -g @fzf-tmux-options "-p 80%,80%"
# 只搜索当前 session 的 window（不加 -a）
set-environment -g TMUX_FZF_WINDOW_FILTER "#{==:1,1}"

unbind s
unbind w

bind-key s run-shell -b "${XDG_DATA_HOME}/tmux/plugins/tmux-fzf/scripts/session.sh switch"
bind-key w run-shell -b "${XDG_DATA_HOME}/tmux/plugins/tmux-fzf/scripts/window.sh switch"
# bind-key p run-shell -b "${XDG_DATA_HOME}/tmux/plugins/tmux-fzf/scripts/pane.sh switch"


##### 启动 TPM #####

run-shell "${XDG_DATA_HOME}/tmux/plugins/tpm/tpm"

##### 覆盖 tmux-yank 的 copy-mode 绑定（复制后不退出）#####

# y: 复制到系统剪贴板，不退出 copy-mode
unbind -T copy-mode-vi y
bind -T copy-mode-vi y send -X copy-pipe "wl-copy"
# Enter: 复制到系统剪贴板，不退出 copy-mode
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe "wl-copy"
# 鼠标拖拽结束：复制到系统剪贴板，不退出 copy-mode
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy"
