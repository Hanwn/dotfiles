set -g escape-time 0
#set -g mouse on                          # 鼠标支持（滚轮、选中、调整窗格）
set -g history-limit 100000              # 超大历史回滚
set -g display-time 3000                 # 提示信息显示 3 秒
set -g base-index 1                      # 窗口从 1 开始编号（方便按数字快速切换）
set -g pane-base-index 1                 # 窗格也从 1 开始
set -g renumber-windows on               # 关闭窗口后自动重新编号
set -g default-terminal "screen-256color"

# 自定义插件目录
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${XDG_DATA_HOME}/tmux/plugins"

# 如果 tpm 不存在则自动安装
if-shell "[ ! -d ${XDG_DATA_HOME}/tmux/plugins/tpm ]" \
    "run-shell 'git clone https://github.com/tmux-plugins/tpm ${XDG_DATA_HOME}/tmux/plugins/tpm'"

# 初始化 TPM
run-shell "${XDG_DATA_HOME}/tmux/plugins/tpm/tpm"



set -g @plugin 'sainnhe/tmux-fzf'
